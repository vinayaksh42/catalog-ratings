# Every 3 days: pull fresh catalogs and IMDb ratings, then publish the dashboard to GitHub Pages.
#
# The SQLite database (title-to-IMDb matches and every past run) is kept as an asset on a
# GitHub release tagged "data", not in git. Each run downloads it, adds a run, and uploads it back.
name: Update dashboard

on:
  schedule:
    # 06:00 UTC on the 1st, 4th, 7th ... of each month. The gap is shorter across a month end
    # (31st -> 1st), since cron restarts the count every month.
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write # upload the database to the "data" release
  pages: write
  id-token: write

# Never let two runs work on the same database at once.
concurrency:
  group: update-dashboard
  cancel-in-progress: false

env:
  DB_RELEASE: data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore database
        id: restore
        run: |
          mkdir -p backend/data
          if out=$(gh release view "$DB_RELEASE" 2>&1); then
            gh release download "$DB_RELEASE" --pattern catalog.db --dir backend/data
            echo "Restored catalog.db ($(du -h backend/data/catalog.db | cut -f1))"
          elif echo "$out" | grep -qi "release not found"; then
            echo "No '$DB_RELEASE' release yet: starting a new database. The first run takes longest."
          else
            echo "$out"
            exit 1 # don't start over just because GitHub had a hiccup
          fi

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_STATIC_DATA: "1"
        run: |
          npm ci
          npm run build -- --base=./

      - name: Run pipeline and export data
        working-directory: backend
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          REGION: CA
          MAX_PAGES: "0"
          ROTTEN_TOMATOES: "false"
        run: python export_static.py --out ../frontend/dist/data

      # Save the database even if the run failed, so IMDb matches made so far aren't lost.
      - name: Save database
        if: always() && steps.restore.outcome == 'success'
        run: |
          [ -f backend/data/catalog.db ] || exit 0
          gh release view "$DB_RELEASE" > /dev/null 2>&1 || gh release create "$DB_RELEASE" \
            --title "Dashboard database" --latest=false \
            --notes "SQLite database used by the scheduled workflow. Updated automatically; don't delete."
          gh release upload "$DB_RELEASE" backend/data/catalog.db --clobber

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deploy
        uses: actions/deploy-pages@v4
